# 上交所 ETF 份额追踪配置
# 筛选基准日：2026-09-18；整理日期：2026-09-19。
# 数据来源：https://etf.sse.com.cn/fundlist/
# 范围：上交所上市 ETF（含跨境ETF和交易型货币基金）；不含深交所ETF、LOF、REITs。
# 共15类、53只；每类2—5只，按上交所披露规模（亿元）从大到小选取及排列。
# 分类以资产类型、投资区域、跟踪指数和行业暴露为依据；每个代码只出现一次。
# 同一指数的不同基金允许同时入选：这里追踪基金份额，不是去重后的投资组合。
# 规模用于筛选，份额用于追踪；跨基金份额不能直接当作资金规模或净流入。
# 不同ETF的净值、面值、拆分及分红机制不同，因此不再设置跨ETF份额合计。
# 保留原配置字段：mainChart / subCharts / id / title / etfs / code / name。
# 规模、日期和分类依据只写在注释中，不增加程序需识别的新字段。
# 详细分类及选取依据见同目录《分类与筛选说明.md》。

