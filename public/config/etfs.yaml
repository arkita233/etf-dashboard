mainChart:
  title: "核心 ETF 份额追踪"
  etfs:
    - code: "510330"
      name: "沪深300ETF华夏"
    - code: "510050"
      name: "上证50ETF华夏"
    - code: "560010"
      name: "中证1000ETF广发"
    - code: "510500"
      name: "中证500ETF南方"
    - code: "588080"
      name: "科创50ETF易方达"

  # 注：上面 code: ["510050", "510500", "560010"] 这种写法
  # 表示按日加总列表中 ETF 的份额，画成一条「合计」虚线。
  # 只需这3只 ETF 的 JSON 文件存在于 public/data/etfs/，
  # 前端会自动合并。name 是图例／tooltip 上显示的名字。

